<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="420" height="240" fill="#f8f9fa" rx="8"/>

  <!-- Folder: my-coursebook/ -->
  <rect x="24" y="28" width="180" height="36" rx="6" fill="#e8eaf0" stroke="#c5c9d4"/>
  <text x="40" y="50" font-size="14" font-weight="700" fill="#3b4252">my-coursebook/</text>

  <!-- coursebook.md -->
  <rect x="48" y="80" width="140" height="32" rx="6" fill="#fff" stroke="#d0d4de"/>
  <text x="64" y="100" font-size="13" fill="#4b5563">coursebook.md</text>

  <!-- chapters/ folder -->
  <rect x="48" y="128" width="120" height="32" rx="6" fill="#e8eaf0" stroke="#c5c9d4"/>
  <text x="64" y="148" font-size="13" font-weight="600" fill="#3b4252">chapters/</text>

  <!-- chapter files -->
  <rect x="72" y="176" width="156" height="28" rx="5" fill="#fff" stroke="#d0d4de"/>
  <text x="88" y="194" font-size="12" fill="#4b5563">01-introduction.md</text>

  <rect x="72" y="210" width="140" height="28" rx="5" fill="#fff" stroke="#d0d4de"/>
  <text x="88" y="228" font-size="12" fill="#4b5563">02-variables.md</text>

  <!-- Connector lines -->
  <line x1="40" y1="64" x2="40" y2="96" stroke="#b0b4c0" stroke-width="1.5"/>
  <line x1="40" y1="96" x2="48" y2="96" stroke="#b0b4c0" stroke-width="1.5"/>
  <line x1="40" y1="64" x2="40" y2="144" stroke="#b0b4c0" stroke-width="1.5"/>
  <line x1="40" y1="144" x2="48" y2="144" stroke="#b0b4c0" stroke-width="1.5"/>
  <line x1="64" y1="160" x2="64" y2="190" stroke="#b0b4c0" stroke-width="1.5"/>
  <line x1="64" y1="190" x2="72" y2="190" stroke="#b0b4c0" stroke-width="1.5"/>
  <line x1="64" y1="204" x2="64" y2="224" stroke="#b0b4c0" stroke-width="1.5"/>
  <line x1="64" y1="224" x2="72" y2="224" stroke="#b0b4c0" stroke-width="1.5"/>

  <!-- Annotations on the right -->
  <text x="260" y="100" font-size="12" fill="#6b7280">Title + chapter list</text>
  <line x1="250" y1="96" x2="190" y2="96" stroke="#c5c9d4" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="260" y="148" font-size="12" fill="#6b7280">One file per chapter</text>
  <line x1="250" y1="144" x2="170" y2="144" stroke="#c5c9d4" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="260" y="194" font-size="12" fill="#6b7280">Numbered for order</text>
  <line x1="250" y1="190" x2="230" y2="190" stroke="#c5c9d4" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
