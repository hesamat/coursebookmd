<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="480" height="280" fill="#f8f9fa" rx="8"/>

  <!-- Top bar -->
  <rect x="16" y="16" width="448" height="32" rx="6" fill="#e8eaf0" stroke="#c5c9d4"/>
  <circle cx="32" cy="32" r="4" fill="#7c63b8"/>
  <text x="44" y="36" font-size="10" font-weight="600" fill="#4b5563">Menu  Edit  Title  Theme  Present</text>

  <!-- Editor pane -->
  <rect x="16" y="56" width="120" height="208" rx="6" fill="#fff" stroke="#d0d4de"/>
  <text x="44" y="76" font-size="11" font-weight="600" fill="#6b7280">Editor</text>
  <line x1="28" y1="84" x2="124" y2="84" stroke="#e5e7eb"/>
  <text x="28" y="100" font-size="9" fill="#9ca3af" font-family="monospace"># Heading</text>
  <text x="28" y="114" font-size="9" fill="#9ca3af" font-family="monospace">Some text...</text>
  <text x="28" y="128" font-size="9" fill="#9ca3af" font-family="monospace">- list item</text>

  <!-- Preview pane -->
  <rect x="144" y="56" width="220" height="208" rx="6" fill="#fff" stroke="#d0d4de"/>
  <text x="224" y="76" font-size="11" font-weight="600" fill="#6b7280">Preview</text>
  <line x1="156" y1="84" x2="352" y2="84" stroke="#e5e7eb"/>
  <text x="156" y="104" font-size="13" font-weight="700" fill="#3b4252">Heading</text>
  <rect x="156" y="112" width="180" height="4" rx="2" fill="#7c63b8"/>
  <text x="156" y="132" font-size="10" fill="#4b5563">Rendered content with</text>
  <text x="156" y="146" font-size="10" fill="#4b5563">code highlighting, math,</text>
  <text x="156" y="160" font-size="10" fill="#4b5563">and diagrams.</text>
  <rect x="156" y="172" width="100" height="20" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="162" y="186" font-size="8" fill="#6b7280" font-family="monospace">const x = 1;</text>

  <!-- Nav pane -->
  <rect x="372" y="56" width="92" height="208" rx="6" fill="#fff" stroke="#d0d4de"/>
  <text x="392" y="76" font-size="10" font-weight="600" fill="#6b7280">Chapters</text>
  <line x1="380" y1="82" x2="456" y2="82" stroke="#e5e7eb"/>

  <!-- Active chapter -->
  <rect x="380" y="90" width="76" height="18" rx="3" fill="#ede9f6"/>
  <text x="384" y="103" font-size="8" fill="#5b4d8a">1. Getting Started</text>

  <!-- Other chapters -->
  <text x="384" y="122" font-size="8" fill="#6b7280">2. Writing</text>
  <text x="384" y="136" font-size="8" fill="#6b7280">3. Rich Content</text>
  <text x="384" y="150" font-size="8" fill="#6b7280">4. Present</text>

  <!-- Inline TOC under active chapter -->
  <line x1="380" y1="160" x2="456" y2="160" stroke="#e5e7eb" stroke-dasharray="2 2"/>
  <text x="388" y="174" font-size="7" fill="#9ca3af">What is...</text>
  <text x="388" y="186" font-size="7" fill="#9ca3af">Opening...</text>
  <text x="388" y="198" font-size="7" fill="#9ca3af">Creating...</text>
  <text x="388" y="210" font-size="7" fill="#9ca3af">Navigation</text>

  <!-- Labels with arrows -->
  <text x="60" y="280" font-size="9" fill="#9ca3af" text-anchor="middle">Editor</text>
  <text x="254" y="280" font-size="9" fill="#9ca3af" text-anchor="middle">Live Preview</text>
  <text x="418" y="280" font-size="9" fill="#9ca3af" text-anchor="middle">Navigation</text>
</svg>
